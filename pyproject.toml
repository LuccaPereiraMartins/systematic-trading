[project]
name = "systematic-trading"
version = "0.1.0"
description = "Financial document triage API and benchmarks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.139.2",
    "uvicorn[standard]==0.51.0",
    "python-dotenv==1.2.2",
    "pydantic==2.13.5",
    "scikit-learn==1.9.1",
    "joblib==1.6.0",
]

[dependency-groups]
models = [
    "openai==3.22.1",
    "requests",
    "edgartools==5.59.1",
    "beautifulsoup4>=4.15.0",
    "datasketch>=2.0.0",
    "langid>=1.1.6",
    "tiktoken>=0.14.0",
    "filelock>=4.0.10",
    "scipy",
]
encoders = [
    "torch==2.14.0",
    "transformers==5.17.0",
    "numpy",
]
laya = [
    "bitsandbytes>=0.50.2",
    "laya==0.3.21",
    "peft==0.21.2",
    "torch==2.14.0",
]
dev = [
    "ruff",
]
reports = [
    "matplotlib>=3.11.2",
    "pypdf>=6.19.0",
    "reportlab>=5.0.1",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
