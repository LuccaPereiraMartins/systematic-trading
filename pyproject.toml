[project]
name = "systematic-trading"
version = "0.1.0"
description = "Live MANU ticks API and SEC filing triage models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.139.2",
    "uvicorn[standard]==0.51.0",
    "python-dotenv==1.2.2",
    "lse-data==0.14.0",
]

[dependency-groups]
models = [
    "openai==3.22.1",
    "pydantic==2.13.5",
    "scikit-learn==1.9.1",
    "requests",
    "edgartools==5.59.1",
]
encoders = [
    "torch==2.14.0",
    "transformers==5.17.0",
    "numpy",
]
laya = [
    "laya==0.3.21",
    "peft==0.21.2",
    "torch==2.14.0",
]
dev = [
    "pytest",
    "httpx",
    "ruff",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "decision_models"]
