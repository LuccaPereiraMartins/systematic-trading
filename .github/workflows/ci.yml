name: ci

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install lint dependencies
        run: uv sync --locked --only-group dev
      - name: Lint
        run: uv run --no-sync ruff check .
